<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CosmoGifts — Intro</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body, html { height:100%; overflow:hidden; background:#000; }

    .loader {
      position:fixed;
      inset:0;
      z-index:9999;
      animation: hide 0.8s forwards 5.5s;
    }

    @keyframes hide { to { opacity:0; visibility:hidden; } }

    .space {
      position:relative;
      width:100%;
      height:100%;
      background: radial-gradient(ellipse at bottom, #0a001f 0%, #000 100%);
    }

    /* Звёзды — белые с лёгким бирюзовым оттенком, неподвижные, только мерцают */
    .stars { position:absolute; inset:0; pointer-events:none; }
    .star {
      position:absolute;
      width:0; height:0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 12px solid #f0faff;          /* белый + очень лёгкий бирюзовый */
      transform: rotate(45deg);
      box-shadow: 
        0 0 10px 3px #e0faff,
        0 0 20px 6px #c0f0ff,
        inset 0 0 4px #ffffff90;
      opacity: 0.75;
      animation: twinkle 3.8s infinite alternate ease-in-out;
    }

    .star::before,
    .star::after {
      content:"";
      position:absolute;
      top:50%; left:50%;
      width:100%; height:100%;
      background:inherit;
      transform: translate(-50%,-50%) rotate(90deg);
    }

    @keyframes twinkle {
      0%, 100% { opacity:0.5;  transform: rotate(45deg) scale(0.8); }
      50%      { opacity:1.0;  transform: rotate(45deg) scale(1.12); }
    }

    /* Планеты — оставил как было (можно потом доработать) */
    .planet {
      position:absolute;
      border-radius:50%;
      overflow:hidden;
      box-shadow: 
        inset -15px -15px 30px rgba(0,0,0,0.7),
        inset 10px 10px 25px rgba(255,255,255,0.25),
        0 0 60px rgba(255,215,0,0.4);
    }

    .planet::before {
      content:"";
      position:absolute;
      inset:12%;
      border-radius:50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.45), transparent 65%);
    }

    .planet.gold   { width:170px; height:170px; top:15%; left:65%; background: linear-gradient(135deg, #f5d742, #d4a017, #b8860b); }
    .planet.blue   { width:140px; height:140px; top:62%; left:22%; background: linear-gradient(145deg, #627eea, #3b5998, #192f5e); }
    .planet.dark   { width:210px; height:210px; top:35%; left:78%; background: linear-gradient(135deg, #2b2f7e, #1e1e4d, #0f0f2e); }

    .planet.gold::after, .planet.blue::after, .planet.dark::after {
      content:"₿";
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      color:#111; font-size:5.5rem; font-weight:bold;
      text-shadow: 0 0 20px #ffeb3b;
    }

    /* Комета — точная копия TON-ромба из твоей ссылки, перевёрнутая на бок (остриём вправо) */
    .comet {
      position:absolute;
      top:28%;
      left:-30%;
      width:280px;
      height:140px;
      animation: fly 5.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      animation-delay:0.4s;
    }

    @keyframes fly {
      0%   { left:-30%; }
      35%  { left:10%;  animation-timing-function: cubic-bezier(0.47, 0, 0.745, 0.715); }
      70%  { left:55%;  animation-timing-function: cubic-bezier(0.39, 0.575, 0.565, 1); }
      100% { left:130%; }
    }

    .ton-diamond {
      position:relative;
      width:100%;
      height:100%;
      background: linear-gradient(135deg, #29b6f6, #0288d1, #01579b);
      clip-path: polygon(0% 50%, 40% 0%, 100% 0%, 100% 100%, 40% 100%);
      /* перевёрнутый ромб остриём вправо */
      box-shadow: 
        0 0 60px #4fc3f7aa,
        0 0 120px #0288d155,
        inset 10px 0 30px rgba(255,255,255,0.3),
        inset -15px 0 40px rgba(0,0,0,0.65);
      transform: rotate(0deg); /* уже в нужной ориентации */
    }
    .ton-diamond::before {
      content:"";
      position:absolute;
      inset:18% 25% 18% 12%;
      background: linear-gradient(to right, #e3f2fd88, transparent);
      opacity:0.5;
    }

    .ton-diamond::after {
      content:"TON";
      position:absolute;
      inset:0 15% 0 30%;
      display:flex; align-items:center; justify-content:center;
      color:#e3f2fd; font-size:3.2rem; font-weight:900;
      text-shadow: 0 0 18px #ffffff;
      letter-spacing:1.5px;
    }

    /* Хвост кометы */
    .comet-tail {
      position:absolute;
      top:45%;
      right:100%;
      width:580px;
      height:4px;
      background: linear-gradient(to right, transparent, #4fc3f7cc 35%, transparent);
      opacity:0.8;
      filter:blur(10px);
    }

    .comet-glow {
      position:absolute;
      top:10%;
      right:70%;
      width:800px;
      height:200px;
      background: radial-gradient(ellipse at right, #4fc3f766 0%, transparent 70%);
      filter:blur(35px);
      opacity:0.6;
    }

    .loading-text {
      position:absolute;
      bottom:10%;
      left:50%;
      transform:translateX(-50%);
      color:#b3e5fc;
      font-size:3.6rem;
      font-weight:900;
      text-shadow:0 0 40px #4fc3f7;
      opacity:0;
      animation: text-fade 5.5s forwards;
    }

    @keyframes text-fade {
      0%,10%  { opacity:0; }
      20%,80% { opacity:0.92; }
      95%,100%{ opacity:0; }
    }
  </style>
</head>
<body>

  <div class="loader">
    <div class="space">

      <!-- Звёзды -->
      <div class="stars"></div>

      <!-- Планеты -->
      <div class="planet gold"></div>
      <div class="planet blue"></div>
      <div class="planet dark"></div>

      <!-- Комета -->
      <div class="comet">
        <div class="ton-diamond">
          <div class="comet-tail"></div>
          <div class="comet-glow"></div>
        </div>
      </div>

      <div class="loading-text">CosmoGifts</div>
    </div>
  </div>

  <!-- Основной контент -->
  <div style="height:100vh; background:#000; color:#fff; display:flex; align-items:center; justify-content:center; font-size:3.5rem;">
    Добро пожаловать в CosmoGifts!
  </div>

  <script>
    // Генерация звёзд
    const starsContainer = document.querySelector('.stars');
    for (let i = 0; i < 130; i++) {
      const star = document.createElement('div');
      star.className = 'star';

      const size = Math.random() * 18 + 5;
      star.style.borderLeft   = `${size / 2}px solid transparent`;
      star.style.borderRight  = `${size / 2}px solid transparent`;
      star.style.borderBottom = `${size}px solid #f0faff`;

      star.style.left = Math.random() * 100 + '%';
      star.style.top  = Math.random() * 100 + '%';

      star.style.animationDelay    = Math.random() * 4.5 + 's';
      star.style.animationDuration = (Math.random() * 3.5 + 2.8) + 's';

      starsContainer.appendChild(star);
    }
  </script>

</body>
</html>
