<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CosmicGifts</title>
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Telegram WebApp (ОБЯЗАТЕЛЬНО) -->
  <script src="https://telegram.org/js/telegram-web-app.js?61"></script>

  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body>

  <div class="stars"></div>

  <div id="main-app">

    <!-- Главная -->
    <div id="title-tab" class="tab-content active">
      <div class="welcome-box">
        <h1>Добро пожаловать в CosmicGifts</h1>
        <p>1 Telegram = 1 аккаунт</p>
        <p>Пополнение: отправь TON на адрес игры с комментарием = твой username</p>
        <p>Создатель — @drozddos</p>
      </div>
    </div>

    <!-- Кейсы -->
    <div id="cases-tab" class="tab-content">
      <h2>Кейсы</h2>
      <p>В разработке</p>
    </div>

    <!-- Краш -->
    <div id="crash-tab" class="tab-content">
      <div class="crash-frame">
        <div class="game-zone">
          <div class="grid-bg"></div>
          <canvas id="crash-graph" style="width:100%; height:100%; display:block; background:transparent;"></canvas>
          <div id="ton-icon">₿</div>
          <div id="current-multiplier">1.00x</div>
        </div>

        <div class="crash-controls">
          <div class="expectation-bar">
            <span>Ожидание</span>
            <div class="multi-history"></div>
          </div>

          <div class="bet-row">
            <input type="number" id="bet-amount" placeholder="0.00" min="0.05" step="0.01" class="bet-input">
            <button id="place-bet-btn">Сделать ставку</button>
            <button id="cash-out-btn" style="display:none;">Вывести</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Кошелёк (теперь это "Баланс и операции") -->
    <div id="wallet-tab" class="tab-content">
      <h2>Баланс и операции</h2>
      
      <div id="user-info" style="text-align:center; font-size:18px; margin:20px 0; padding:15px; background:rgba(0,0,0,0.4); border-radius:12px;">
        Загрузка профиля...
      </div>

      <div id="wallet-info">
        <button id="deposit-btn" class="big-btn">Пополнить баланс</button>
        <button id="withdraw-btn" class="big-btn">Вывести TON</button>
      </div>
      
      <p id="wallet-status" style="margin-top:15px; text-align:center; color:#aaa;"></p>
    </div>

    <!-- Профиль -->
    <div id="profile-tab" class="tab-content">
      <h2>Профиль</h2>
      <div id="profile-content">
        <!-- Будет заполняться динамически -->
      </div>
    </div>

    <!-- Навбар -->
    <div id="bottom-nav">
      <div class="nav-item active" data-tab="title-tab">Главная</div>
      <div class="nav-item" data-tab="cases-tab">Кейсы</div>
      <div class="nav-item" data-tab="crash-tab">Краш</div>
      <div class="nav-item" data-tab="wallet-tab">Баланс</div>
      <div class="nav-item" data-tab="profile-tab">Профиль</div>
    </div>

  </div>

  <script src="js/tabs.js"></script>
  <script src="js/ya-ebal.js"></script>
</body>
</html>
